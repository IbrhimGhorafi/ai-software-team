name: Secret scanning

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan repository for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository history for Gitleaks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run free Gitleaks CLI
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/path" \
            ghcr.io/gitleaks/gitleaks:v8.28.0 \
            detect --source=/path --redact --verbose
